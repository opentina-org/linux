# SPDX-License-Identifier: GPL-2.0
%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/allwinner,sun60i-a733-de352-clk.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Allwinner A733 DE352 DETOP Clock Controller

maintainers:
  - Chen-Yu Tsai <wens@csie.org>

description: |
  DE352 keeps mixer/display module clocks in the DETOP register block at
  DE + 0x8000 (RESET/CLK/MBUS), not at the DE2/DE3 clock@0 layout.

properties:
  "#clock-cells":
    const: 1

  "#reset-cells":
    const: 1

  compatible:
    const: allwinner,sun60i-a733-de352-clk

  reg:
    maxItems: 1

  clocks:
    items:
      - description: DE AHB fabric gate (CLK_DE_AHB_GATE)
      - description: DE MBUS fabric gate (CLK_MBUS_DESYS_GATE)
      - description: DE bus clock (CLK_BUS_DE0)
      - description: DE module clock (CLK_DE0)

  clock-names:
    items:
      - const: ahb
      - const: mbus
      - const: bus
      - const: mod

  resets:
    items:
      - description: DE system reset (RST_BUS_DE_SY)
      - description: DE0 bus reset (RST_BUS_DE0)

  reset-names:
    items:
      - const: sys
      - const: bus

  power-domains:
    maxItems: 1

required:
  - "#clock-cells"
  - "#reset-cells"
  - compatible
  - reg
  - clocks
  - clock-names
  - resets
  - reset-names

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/sun60i-a733-ccu.h>
    #include <dt-bindings/reset/sun60i-a733-ccu.h>

    bus@5000000 {
        #address-cells = <1>;
        #size-cells = <1>;
        ranges = <0x0 0x0 0x05000000 0x400000>;

        de352_clocks: clock@8000 {
            compatible = "allwinner,sun60i-a733-de352-clk";
            reg = <0x8000 0x100>;
            clocks = <&ccu CLK_DE_AHB_GATE>,
                     <&ccu CLK_MBUS_DESYS_GATE>,
                     <&ccu CLK_BUS_DE0>,
                     <&ccu CLK_DE0>;
            clock-names = "ahb",
                          "mbus",
                          "bus",
                          "mod";
            resets = <&ccu RST_BUS_DE_SY>,
                     <&ccu RST_BUS_DE0>;
            reset-names = "sys", "bus";
            #clock-cells = <1>;
            #reset-cells = <1>;
        };
    };

...
